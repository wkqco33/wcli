version: '3'

vars:
  MODULE: github.com/wkqco33/wcli
  BINARY_NAME: wcli
  BIN_DIR: ./bin
  GOBIN:
    sh: echo "$(go env GOBIN)" | grep -v '^$' || echo "$(go env GOPATH)/bin"

tasks:
  default:
    aliases: [help]
    desc: 사용 가능한 태스크 목록 출력
    silent: true
    cmds:
      - task --list

  # --- 개발 및 빌드 ---

  build:
    aliases: [b]
    desc: 전체 패키지 빌드 (컴파일 오류 확인)
    cmds:
      - go build ./...

  build-bin:
    desc: 로컬 CLI 바이너리 빌드 (./bin/wcli)
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BIN_DIR}}/{{.BINARY_NAME}}'
    cmds:
      - go build -o {{.BIN_DIR}}/{{.BINARY_NAME}} ./cmd/wcli
      - 'echo "바이너리 빌드 완료: {{.BIN_DIR}}/{{.BINARY_NAME}}"'

  run:
    desc: 빌드된 로컬 CLI 바이너리 실행
    deps: [build-bin]
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY_NAME}} {{.CLI_ARGS}}'

  # --- 테스트 및 커버리지 ---

  test:
    aliases: [t]
    desc: 전체 테스트 실행
    cmds:
      - go test ./...

  test-v:
    desc: 전체 테스트 실행 (상세 출력)
    cmds:
      - go test -v ./...

  test:fast:
    aliases: [tf]
    desc: 캐시 없이 전체 단위 테스트 초고속 실행 (TDD 피드백용)
    cmds:
      - go test -count=1 ./...

  test:parallel:
    aliases: [tp]
    desc: 동시 병렬 실행 및 레이스 컨디션 정밀 검증
    cmds:
      - go test -race -parallel=8 -count=1 ./...

  test-race:
    desc: 전체 테스트 실행 (경쟁 상태 검지기 적용)
    cmds:
      - go test -race ./...

  test:watch:
    desc: TDD 워치 모드 (gow 또는 entr 설치 시 자동 실행)
    cmds:
      - |
        if command -v gow >/dev/null 2>&1; then
          gow -c test ./...
        elif command -v entr >/dev/null 2>&1; then
          find . -name "*.go" | entr -c go test ./...
        else
          echo "워치 도구(gow 또는 entr)가 설치되어 있지 않습니다."
          echo "gow 설치: go install github.com/mitranim/gow@latest"
          go test -v ./...
        fi

  bench:
    desc: 벤치마크 실행
    cmds:
      - go test -bench=. -benchmem ./...

  cover:
    desc: 테스트 커버리지 측정 및 HTML 리포트 생성
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "커버리지 리포트 생성 완료: coverage.html"'

  cover-pct:
    desc: 패키지별 테스트 커버리지 퍼센트 출력
    cmds:
      - go test -cover ./...

  cover-func:
    desc: 함수별 커버리지 상세 분석 출력
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  # --- 코드 품질 및 린트 ---

  fmt:
    aliases: [f]
    desc: gofmt 코드 포맷 적용
    cmds:
      - gofmt -w .

  fmt-check:
    desc: 코드 포맷 준수 여부 확인 (수정 없음)
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "포맷이 맞지 않는 파일:"
          echo "$out"
          exit 1
        fi
        echo "모든 파일이 gofmt 포맷을 준수하고 있습니다."

  vet:
    desc: go vet 정적 분석 실행
    cmds:
      - go vet ./...

  lint:
    aliases: [l]
    desc: 린터 실행 (staticcheck 또는 golangci-lint)
    cmds:
      - |
        export PATH="$PATH:$(go env GOPATH)/bin"
        if command -v staticcheck >/dev/null 2>&1; then
          staticcheck ./...
        elif command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run --disable=errcheck ./...
        else
          echo "린터가 설치되어 있지 않습니다."
          echo "staticcheck 설치: go install honnef.co/go/tools/cmd/staticcheck@latest"
          exit 1
        fi

  check:
    aliases: [c]
    desc: 포맷 확인 + vet + 린트 + 테스트 일괄 실행
    cmds:
      - task: fmt-check
      - task: vet
      - task: lint
      - task: test

  # --- 예제 실행 ---

  example:config:
    desc: Config 데모 예제 실행
    cmds:
      - go run ./examples/config_demo/main.go

  example:features:
    desc: Features 데모 예제 실행
    cmds:
      - go run ./examples/features_demo/main.go

  example:logging:
    desc: Logging & Error Handling 데모 예제 실행
    cmds:
      - go run ./examples/logging_error/main.go

  example:rich:
    desc: Rich UI 컴포넌트 데모 예제 실행
    cmds:
      - go run ./examples/rich_demo/main.go

  # --- 의존성 관리 ---

  tidy:
    desc: go mod tidy (의존성 정리)
    cmds:
      - go mod tidy

  deps:
    desc: 의존성 목록 출력
    cmds:
      - go list -m all

  # --- 설치 / 제거 / 정리 ---

  install:
    desc: wcli CLI를 GOPATH/bin 에 설치
    cmds:
      - go install ./cmd/wcli
      - 'echo "설치 완료: {{.GOBIN}}/{{.BINARY_NAME}}"'

  uninstall:
    desc: GOPATH/bin 에서 wcli 제거
    cmds:
      - rm -f "{{.GOBIN}}/{{.BINARY_NAME}}" "{{.GOBIN}}/{{.BINARY_NAME}}.exe"
      - 'echo "제거 완료: {{.GOBIN}}/{{.BINARY_NAME}}"'

  clean:
    desc: 빌드 아티팩트 (bin/), 커버리지 파일 및 임시 파일 제거
    cmds:
      - go clean ./...
      - rm -rf {{.BIN_DIR}} coverage.out coverage.html
      - 'echo "정리 완료"'
