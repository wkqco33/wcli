version: '3'

vars:
  MODULE: github.com/seoyc/wcli
  GOBIN:
    sh: echo "$(go env GOPATH)/bin"

tasks:
  default:
    desc: 사용 가능한 태스크 목록 출력
    silent: true
    cmds:
      - task --list

  # --- 개발 ---

  build:
    desc: 패키지 빌드 (컴파일 오류 확인)
    cmds:
      - go build ./...

  test:
    desc: 전체 테스트 실행
    cmds:
      - go test ./...

  test-v:
    desc: 전체 테스트 실행 (상세 출력)
    cmds:
      - go test -v ./...

  bench:
    desc: 벤치마크 실행
    cmds:
      - go test -bench=. -benchmem ./...

  cover:
    desc: 테스트 커버리지 측정 및 HTML 리포트 생성
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "커버리지 리포트: coverage.html"'

  cover-pct:
    desc: 테스트 커버리지 퍼센트 출력
    cmds:
      - go test -cover ./...

  # --- 코드 품질 ---

  vet:
    desc: go vet 정적 분석 실행
    cmds:
      - go vet ./...

  fmt:
    desc: gofmt 코드 포맷 적용
    cmds:
      - gofmt -w .

  fmt-check:
    desc: 포맷 규칙 준수 여부 확인 (수정 없음)
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "포맷이 맞지 않는 파일:"
          echo "$out"
          exit 1
        fi

  lint:
    desc: staticcheck 린터 실행 (없으면 설치 안내)
    cmds:
      - |
        command -v staticcheck >/dev/null 2>&1 || {
          echo "staticcheck가 설치되어 있지 않습니다."
          echo "설치: go install honnef.co/go/tools/cmd/staticcheck@latest"
          exit 1
        }
        staticcheck ./...

  check:
    desc: fmt-check + vet + test 한번에 실행
    cmds:
      - task: fmt-check
      - task: vet
      - task: test

  # --- 설치 / 삭제 ---

  install:
    desc: 현재 모듈을 GOPATH/bin에 설치 (예제 바이너리가 있을 경우)
    cmds:
      - |
        if ls cmd/*/main.go 1>/dev/null 2>&1; then
          go install ./cmd/...
          echo "설치 완료: {{.GOBIN}}"
        else
          echo "설치할 바이너리가 없습니다 (cmd/ 디렉토리 없음)."
          echo "라이브러리로 사용: go get {{.MODULE}}"
        fi

  uninstall:
    desc: GOPATH/bin에서 설치된 바이너리 제거
    cmds:
      - |
        if ls cmd/*/main.go 1>/dev/null 2>&1; then
          for dir in cmd/*/; do
            bin="{{.GOBIN}}/$(basename "$dir")"
            if [ -f "$bin" ]; then rm -f "$bin" && echo "삭제: $bin"; fi
          done
        else
          echo "제거할 바이너리가 없습니다."
        fi

  # --- 의존성 ---

  tidy:
    desc: go mod tidy (의존성 정리)
    cmds:
      - go mod tidy

  deps:
    desc: 의존성 목록 출력
    cmds:
      - go list -m all

  # --- 정리 ---

  clean:
    desc: 빌드 아티팩트 및 커버리지 파일 제거
    cmds:
      - go clean ./...
      - rm -f coverage.out coverage.html
